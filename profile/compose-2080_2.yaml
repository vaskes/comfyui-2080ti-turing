name: comfyui2080-2

# Profile: instance 2 of 2 (RTX 2080 Ti #2)
# See profile/README.md for the architecture.

services:
  comfyui2080_2:
    build:
      context: ..
      dockerfile: profile/Dockerfile.production
    image: comfyui-workstation:cu130-torch-stable-gcc-prod
    container_name: comfyui2080_2
    restart: unless-stopped
    runtime: nvidia
    entrypoint: [/usr/local/bin/comfyui-entrypoint.sh]
    environment:
      NVIDIA_VISIBLE_DEVICES: "2"   # GPU index 2 in nvidia-smi (RTX 2080 Ti #2)
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      COMFYUI_ARGS: ${COMFYUI_ARGS:---extra-model-paths-config /opt/ComfyUI/user/extra_model_paths.yaml --listen 0.0.0.0 --port 8188 --lowvram --reserve-vram 0 --enable-triton-backend --enable-manager --use-ck-attention --disable-dynamic-vram --disable-cuda-malloc --disable-smart-memory}
    ports:
      - "8189:8188"
    volumes:
      # Shared
      - /opt/comfyui/models:/opt/ComfyUI/models
      - /opt/comfyui/input:/opt/ComfyUI/input
      - /opt/comfyui/workflows:/opt/ComfyUI/workflows
      - /opt/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      # Per-instance
      - /opt/comfyui-2080_2/output:/opt/ComfyUI/output
      - /opt/comfyui-2080_2/user:/opt/ComfyUI/user
      - /opt/comfyui-git:/opt/comfyui-git:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["2"]
