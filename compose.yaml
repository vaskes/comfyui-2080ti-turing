name: comfyui

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      # Build args: use Dockerfile defaults (pinned commits) unless overridden.
      # Override at build time: COMFYUI_REF=abcdef docker compose build
      args:
        COMFYUI_REF: ${COMFYUI_REF:-5cc4b87}
        COMFY_MANAGER_REF: ${COMFY_MANAGER_REF:-main}
    image: comfyui-workstation:cu130-torch-stable-gcc
    container_name: comfyui
    restart: unless-stopped
    runtime: nvidia
    # Entrypoint is baked into the image at /usr/local/bin/comfyui-entrypoint.sh
    # (see Dockerfile). It auto-installs SageAttention 1.0.6 + pytest on first
    # use (idempotent), then exec ComfyUI with $COMFYUI_ARGS.
    # Override default backend (--use-ck-attention) via:
    #   COMFYUI_ARGS="--use-sage-attention" docker compose up -d
    entrypoint: [/usr/local/bin/comfyui-entrypoint.sh]
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # COMFYUI_ARGS is the default attention backend flag set in the Dockerfile.
      # Override at start time (env interpolation uses shell-style default):
      #   COMFYUI_ARGS="--use-sage-attention" docker compose up -d
      #   --use-ck-attention     fastest correct, default (works for all models)
      #   --use-sage-attention   Kijai-patch fallback (for Sage Attn patch nodes)
      #   --use-flash-attention  experimental v0.3 (H3 only)
      # The matrix runner always sets COMFYUI_ARGS explicitly.
      # Production contract (v1.0.5). The trio
      #   --disable-cuda-malloc + PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True + --disable-dynamic-vram
      # is REQUIRED to avoid cudaMallocAsync pool fragmentation on sm_75.
      # Without this, runtime scales exponentially with workload size (10s→47m, 15s→8-12h OOM).
      # See flash-attention-sm75/CREDITS.md for the AMXELA recipe this came from.
      # Override at start time: COMFYUI_ARGS="..." docker compose up -d
      COMFYUI_ARGS: ${COMFYUI_ARGS:---extra-model-paths-config /opt/ComfyUI/user/extra_model_paths.yaml --listen 0.0.0.0 --port 8188 --lowvram --reserve-vram 0 --enable-triton-backend --enable-manager --use-ck-attention --disable-dynamic-vram --disable-cuda-malloc --disable-smart-memory}
      # PyTorch CUDA allocator tuning. expandable_segments is no-op under
      # cudaMallocAsync — combine with --disable-cuda-malloc for it to work.
      # This is the H3 32B int8_convrot OOM fix on sm_75 (Turing). See commit history.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    ports:
      - "8188:8188"
    volumes:
      # Модели, output, input, user, workflows — наружу хоста, чтобы переживали редеплой.
      - /opt/comfyui/models:/opt/ComfyUI/models
      - /opt/comfyui/output:/opt/ComfyUI/output
      - /opt/comfyui/input:/opt/ComfyUI/input
      - /opt/comfyui/user:/opt/ComfyUI/user
      - /opt/comfyui/workflows:/opt/ComfyUI/workflows
      - /opt/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      # v0.3 (real sm_75) flash_attn source + .so, bind-mounted to /tmp/flash-attention
      - /opt/flash-sm75-build:/tmp/flash-attention-build
      # Source repo (read-only) — for running tests inside the container
      - /opt/comfyui-git:/opt/comfyui-git:ro
      - /opt/comfyui/logs:/var/log/comfyui
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["0"]
