name: comfyui

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMFYUI_REF: master
        COMFY_MANAGER_REF: main
    image: comfyui-workstation:cu130-torch-stable-gcc
    container_name: comfyui
    restart: unless-stopped
    runtime: nvidia
    # Entrypoint is baked into the image at /usr/local/bin/comfyui-entrypoint.sh
    # (see Dockerfile). It auto-installs SageAttention 1.0.6 + pytest on first
    # use (idempotent), then exec ComfyUI with $COMFYUI_ARGS.
    # Override default backend (--use-ck-attention) via:
    #   COMFYUI_ARGS="--use-sage-attention" docker compose up -d
    entrypoint: [/usr/local/bin/comfyui-entrypoint.sh]
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # COMFYUI_ARGS is the variable expanded by the Dockerfile CMD.
      # Override with COMFYUI_ARGS="--use-ck-attention" docker compose up -d
      # to change attention backend without editing this file.
      # Default: --use-ck-attention (fastest correct, works for all models).
      # Override at start time: COMFYUI_ARGS="--use-sage-attention" docker compose up -d
      #   --use-sage-attention   fallback for workflows that use Sage Attn patch
      #                            nodes by Kijai (int8 quant + kijai patch node)
      #   --use-flash-attention  experimental v0.3 (H3 only, broken for Qwen int8_convrot)
      # The matrix runner always sets COMFYUI_ARGS explicitly.
      COMFYUI_ARGS: --use-ck-attention
    ports:
      - "8188:8188"
    volumes:
      # Модели, output, input, user, workflows — наружу хоста, чтобы переживали редеплой.
      - /opt/comfyui/models:/opt/ComfyUI/models
      - /opt/comfyui/output:/opt/ComfyUI/output
      - /opt/comfyui/input:/opt/ComfyUI/input
      - /opt/comfyui/user:/opt/ComfyUI/user
      - /opt/comfyui/workflows:/opt/ComfyUI/workflows
      - /opt/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      # v0.3 (real sm_75) flash_attn source + .so, bind-mounted to /tmp/flash-attention
      - /opt/flash-sm75-build:/tmp/flash-attention-build
      # Source repo (read-only) — for running tests inside the container
      - /opt/comfyui-git:/opt/comfyui-git:ro
      - /opt/comfyui/logs:/var/log/comfyui
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["0"]
